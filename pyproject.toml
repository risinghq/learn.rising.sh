[project]
name = "qiskit-guides-curso"
version = "0.1.0"
description = "Interactive course in Spanish on the IBM Quantum / Qiskit guides"
requires-python = ">=3.15"
dependencies = [
  "qiskit[visualization,qasm3-import]>=2.5.2,<2.6",
  "qiskit-aer~=0.18.0",
  "qiskit-ibm-runtime>=0.50",
  "qiskit-mitigation~=0.1",
  "qiskit-addon-utils~=0.4.0",
  "matplotlib",
  "pylatexenc",
  "ipython",
  "samplomatic",
  "marimo>=0.25.2",
  "nbformat>=5.11.1",
  "qiskit-addon-obp>=0.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2",
    "pytest>=9.1.1",
    "ruff>=0.17",
]
tools = [
    "edge-tts",
    "playwright",
]

runner = [
    "qiskit",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "matplotlib",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["exercises", "practica", "muestras", "tests/mutants"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]
# Typography of the lesson text and of the pronunciation rules.
allowed-confusables = ["×", "−", "–", "‘", "’", "′"]

[tool.mypy]
strict = true
# A course folder has its own `plan` and `parte*` modules, so mise runs mypy once per folder.
files = ["qgcheck", "runner", "tools", "tests", "lessons_src/lib.py", "lessons_src/build.py"]
exclude = ["tests/mutants/", "runner/worker/"]
mypy_path = ["stubs", "runner", "lessons_src", "tools", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
