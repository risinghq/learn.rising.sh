[tools]
bun = "1.4.3"
gitleaks = "8.30.1"
node = "26.12.0"
python = "3.15.0"
uv = "0.13.3"

[env]
UV_LOCKED = "1"
_.path = ["runner/worker/node_modules/.bin", "editor/node_modules/.bin"]

[tasks.install]
description = "Install Python and JavaScript dependencies from the lockfiles, the site's KaTeX and fonts, the Playwright browser and the upstream guides"
run = [
  "uv sync --locked --all-groups --compile-bytecode",
  "bun install --frozen-lockfile",
  "bun install --cwd editor --frozen-lockfile",
  "bun install --cwd app --frozen-lockfile",
  "mise run generate:vendor",
  "mise run generate:scripts",
  "mise run generate:app",
  "bun install --cwd runner/worker --frozen-lockfile",
  "uv run --group tools playwright install ${CI:+--with-deps} chromium",
  "bunx playwright install chromium",
  "uv run python tools/fetch_docs.py",
]

[tasks.fetch]
description = "Download the upstream Qiskit guides into .cache/qiskit-docs if they are missing"
run = "uv run python tools/fetch_docs.py"

[tasks."lint:py"]
description = "Check Python with ruff"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."lint:js"]
description = "Check JavaScript and TypeScript with oxlint"
run = "oxlint --deny-warnings"

[tasks."lint:fmt"]
description = "Check the format of Markdown, JSON, YAML, JavaScript and TypeScript with oxfmt"
run = "oxfmt --check"

[tasks."lint:secrets"]
description = "Scan the working tree for secrets with gitleaks"
run = "gitleaks dir . --no-banner --redact"

[tasks.lint]
description = "Run every lint check"
depends = ["lint:*"]

[tasks.fix]
description = "Apply safe fixes and format Python, JavaScript, TypeScript, Markdown, JSON and YAML"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
  "oxlint --fix",
  "oxfmt --write",
]

[tasks."typecheck:py"]
description = "Check Python types with mypy in strict mode"
run = [
  "uv run mypy",
  "for dir in lessons_src/*/; do case $dir in *__pycache__*) continue;; esac; MYPYPATH=${dir%/} uv run mypy ${dir%/} || exit 1; done",
]

[tasks."typecheck:ts"]
description = "Check the TypeScript of the Worker, the editor, the app, the site, the tools and the tests with tsc"
run = ["tsc -p runner/worker", "tsc -p editor", "tsc -p app", "tsc -p site", "tsc -p ."]

[tasks.typecheck]
description = "Run every type check"
depends = ["typecheck:*"]

[tasks."test:py"]
description = "Run the pytest suites that need no browser"
# The grader tests time learner code against a 10 s limit. This suite runs only beside the notebooks,
# each on its own core, and the browser, Worker and lesson suites wait for it.
wait_for = ["lint", "typecheck", "build"]
run ="uv run pytest tests/exercises_test.py"

[tasks."test:notebooks"]
description = "Run the practice notebooks with solutions and controls at both bounds, and check every exercise"
run = [
  "uv run python tools/practica.py",
  "uv run python tools/exercises.py",
]

[tasks."test:ui"]
description = "Drive the exercise editor, the browser-graded exercises, the project panel, the shell, the drill session, the theme, the optional account and the friends board in a browser, and hold the shell to its script budget"
depends = ["generate:vendor", "generate:scripts", "generate:app"]
wait_for = ["test:py"]
run = [
  "uv run python tests/exercise_ui_test.py",
  "uv run python tests/proyecto_test.py",
  "uv run --group tools python tests/pyodide_ui_test.py",
  "bun tests/account_ui_test.ts",
  "bun tests/friends_test.ts",
  "bun tests/theme_test.ts",
  "bun tests/shell_test.ts",
  "bun tests/session_test.ts",
  "bun tests/budget_test.ts",
]

[tasks."test:walkthrough"]
description = "Play one learner through the whole Qiskit course in a browser, reloading and resuming, and read the path page after every step. Not part of test: it takes 25 s on an idle host and over a minute on a busy one."
depends = ["generate:scripts", "generate:app"]
run = "bun tests/walkthrough_test.ts"

[tasks."test:tools"]
description = "Test the dashboard tool against a local D1 database, and the drill item bank, graders and scheduler"
wait_for = ["test:py"]
run = "bunx vitest run"

[tasks."test:worker"]
description = "Test the runner Worker's limits and accounts against a fake container"
dir = "runner/worker"
depends = ["generate:app"]
wait_for = ["test:py"]
run = "vitest run"

[tasks."test:lessons"]
description = "Run the Python code shown in every lesson and compare the checked outputs"
wait_for = ["test:py"]
run ="uv run python tools/verify.py"

[tasks."test:integration"]
description = "Build the runner image and run the runner tests against it (needs Docker)"
run = "uv run pytest tests/runner_test.py"

[tasks.test]
description = "Run every test that needs no service, network or secret"
depends = ["test:py", "test:notebooks", "test:ui", "test:tools", "test:worker", "test:lessons"]

[tasks."generate:lessons"]
description = "Rewrite site/<course>/lessons/*/lesson.json and site/<course>/course.json of every course from lessons_src"
run = [
  "uv run python lessons_src/build.py qiskit",
  "uv run python lessons_src/build.py computational-physics",
]

[tasks."generate:items"]
description = "Write site/<course>/items.json of every course: the asks of its lessons plus the authored drill items, which git ignores"
run = "bun drill/build.ts"

[tasks."generate:scripts"]
description = "Bundle the TypeScript in site/ and editor/src into the JavaScript the pages load, which git ignores"
run = [
  "bun build site/theme.ts site/account.ts site/qiskit/notebooks.ts site/player/engine.ts --root site --outdir site --format=iife --target=browser",
  "bun build editor/src/index.ts --outfile site/player/editor.js --format=iife --target=browser --minify",
  "bun build site/player/pyodide-worker.ts --outfile site/player/pyodide-worker.js --format=esm --target=browser --minify",
]

[tasks."generate:app"]
description = "Build the React shell in app/ and write its prerendered pages, assets and service worker into site/, which git ignores"
depends = ["generate:items"]
dir = "app"
run = "node scripts/build.ts"

[tasks."generate:vendor"]
description = "Copy KaTeX and Pyodide into site/vendor, and download the Pyodide wheels the browser-graded courses use, which git ignores"
dir = "editor"
run = [
  "node vendor.ts ../site/vendor",
  "node vendor-pyodide.ts ../site/vendor/pyodide",
]

[tasks.generate]
description = "Rewrite every generated file under site/"
depends = ["generate:*"]

[tasks."build:lessons"]
description = "Fail without writing if the committed lesson JSON differs from the build output"
run = [
  "uv run python lessons_src/build.py qiskit --check",
  "uv run python lessons_src/build.py computational-physics --check",
]

[tasks."build:drill"]
description = "Validate the authored drill items and run the code of each parsons, fill and bug item under Qiskit 2.5 and numpy"
run = "bun drill/check.ts"

[tasks.build]
description = "Check that the shipped site files match their sources"
depends = ["build:*"]

[tasks.serve]
description = "Bundle the scripts and build the shell, then serve site/ and grade the exercises on http://127.0.0.1:8810"
depends = ["generate:scripts", "generate:app"]
run = "uv run python tools/serve.py"

[tasks.deploy]
description = "Copy KaTeX and Pyodide into site/vendor, write the drill items, bundle the scripts and build the shell, then run cf deploy in runner/worker with the given arguments"
depends = ["generate:vendor", "generate:items", "generate:scripts", "generate:app"]
dir = "runner/worker"
run = "bunx cf deploy"

[tasks.check]
description = "Run lint, typecheck, test and build. Writes nothing tracked."
depends = ["lint", "typecheck", "test", "build"]
