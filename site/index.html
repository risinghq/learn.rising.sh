<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rising</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="catalog.css">
<script src="theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="top">
  <div class="in">
    <a class="brand" href="/">Rising</a>
    <span class="sp"></span>
    <div data-theme-ctl></div>
  </div>
</header>

<main id="main">
  <h1>Cursos</h1>
  <ul class="courses" id="courses"></ul>
</main>

<script type="module">
const list = document.getElementById('courses');
const get = async (url) => {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
};
const lessonCount = (course) => course.parts.reduce((n, p) => n + p.lessons.length, 0);

const courses = await get('courses.json');
const counts = await Promise.allSettled(courses.map((c) => get(`${c.slug}/course.json`)));

courses.forEach((c, i) => {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = `${c.slug}/`;
  const h = document.createElement('h2');
  h.textContent = c.title;
  const p = document.createElement('p');
  p.textContent = c.summary;
  const facts = [c.language];
  if (counts[i].status === 'fulfilled') facts.push(`${lessonCount(counts[i].value)} lecciones`);
  const meta = document.createElement('p');
  meta.className = 'meta';
  meta.textContent = facts.join(', ');
  a.append(h, p, meta);
  li.append(a);
  list.append(li);
});
</script>
</body>
</html>
