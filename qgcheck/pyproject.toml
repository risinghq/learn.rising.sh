[project]
name = "qgcheck"
version = "0.1.0"
description = "Grade a learner's Python against the cases of an exercise, in a separate process"
requires-python = ">=3.15"
dependencies = ["numpy"]

# What the exercises of the courses import.
[project.optional-dependencies]
courses = [
  "qiskit>=2.6.2",
  "qiskit-aer~=0.18.2",
  # qiskit-addon-obp 0.3.0 imports this removed internal module; unpin when the addon supports runtime 0.52.
  "qiskit-ibm-runtime>=0.51,<0.52",
  "qiskit-addon-obp>=0.3.0",
  "qiskit-addon-utils~=0.4.0",
  "matplotlib",
  "pylatexenc",
  "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This folder is the package: the wheel stores its files under `qgcheck/`.
[tool.hatch.build.targets.wheel]
include = ["*.py"]
exclude = ["/dist"]

[tool.hatch.build.targets.wheel.sources]
"" = "qgcheck"

[tool.hatch.build.targets.sdist]
include = ["*.py", "pyproject.toml"]
